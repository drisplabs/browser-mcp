name: Version Bump

# Opens a release pull request. It deliberately does NOT push to main and does
# NOT tag: main is protected (PR + 5 required checks), so a direct push is
# rejected and the whole workflow fails. Tagging and publishing happen after the
# PR merges — see tag-release.yml.
#
# NOTE ON TOKENS: a pull request created with the default GITHUB_TOKEN does not
# trigger other workflows, so the required checks never start and the PR cannot
# be merged. Set a RELEASE_PAT secret (a PAT or GitHub App token with `contents:
# write` and `pull-requests: write`) so the checks run. Without it this workflow
# still opens the PR, but you will have to kick the checks yourself.

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      preid:
        description: 'Pre-release identifier (alpha, beta, rc) - only for pre-release versions'
        required: false
        type: string
        default: 'beta'

permissions:
  contents: write
  pull-requests: write

jobs:
  open-release-pr:
    name: Open Release PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current version
        id: current_version
        run: |
          CURRENT=$(node -p "require('./package.json').version")
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current version: $CURRENT"

      - name: Bump version
        id: bump
        run: |
          VERSION_TYPE="${{ github.event.inputs.version_type }}"

          # Check if it's a pre-release version
          if [[ "$VERSION_TYPE" == pre* ]]; then
            PREID="${{ github.event.inputs.preid }}"
            if [ -z "$PREID" ]; then
              echo "Error: Pre-release identifier required for pre-release versions"
              exit 1
            fi
            NEW_VERSION=$(npm version $VERSION_TYPE --preid=$PREID --no-git-tag-version)
          else
            NEW_VERSION=$(npm version $VERSION_TYPE --no-git-tag-version)
          fi

          # Remove 'v' prefix from npm version output
          NEW_VERSION=${NEW_VERSION#v}

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "branch=chore/release-v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped version to: $NEW_VERSION"

      - name: Fail if the tag already exists
        run: |
          TAG="v${{ steps.bump.outputs.new_version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Error: tag $TAG already exists — $TAG has already been released."
            exit 1
          fi

      - name: Update package-lock.json
        run: npm install --package-lock-only --ignore-scripts

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git describe --abbrev=0 --tags 2>/dev/null || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "First release, getting all commits"
            CHANGELOG=$(git log --pretty=format:"- %s" --reverse)
          else
            echo "Generating changelog from $PREVIOUS_TAG"
            CHANGELOG=$(git log --pretty=format:"- %s" $PREVIOUS_TAG..HEAD)
          fi

          # Keep the entry for the PR body as well as for CHANGELOG.md
          echo "$CHANGELOG" > /tmp/changelog-entry.md

          # Save changelog
          {
            echo "## [${{ steps.bump.outputs.new_version }}] - $(date +%Y-%m-%d)"
            echo ""
            echo "$CHANGELOG"
            echo ""
          } > CHANGELOG_NEW.md

          # Append to existing changelog if it exists
          if [ -f CHANGELOG.md ]; then
            cat CHANGELOG.md >> CHANGELOG_NEW.md
            mv CHANGELOG_NEW.md CHANGELOG.md
          else
            echo "# Changelog" > CHANGELOG.md
            echo "" >> CHANGELOG.md
            cat CHANGELOG_NEW.md >> CHANGELOG.md
            rm CHANGELOG_NEW.md
          fi

      - name: Commit version bump on a release branch
        run: |
          BRANCH="${{ steps.bump.outputs.branch }}"
          git checkout -b "$BRANCH"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git push --force-with-lease origin "$BRANCH"

      - name: Open pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.bump.outputs.branch }}"
          VERSION="${{ steps.bump.outputs.new_version }}"

          {
            echo "Automated release PR for **v$VERSION** (\`${{ github.event.inputs.version_type }}\` bump from ${{ steps.current_version.outputs.version }})."
            echo ""
            echo "Merging this PR tags \`v$VERSION\` and publishes to npm — see \`.github/workflows/tag-release.yml\`."
            echo ""
            echo "## Changes"
            echo ""
            cat /tmp/changelog-entry.md
          } > /tmp/pr-body.md

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: release v$VERSION" \
            --body-file /tmp/pr-body.md)

          echo "url=$PR_URL" >> $GITHUB_OUTPUT
          echo "Opened $PR_URL"

      - name: Create summary
        env:
          HAS_PAT: ${{ secrets.RELEASE_PAT != '' }}
        run: |
          {
            echo "## Release PR opened"
            echo ""
            echo "- **Previous Version**: ${{ steps.current_version.outputs.version }}"
            echo "- **New Version**: ${{ steps.bump.outputs.new_version }}"
            echo "- **Bump Type**: ${{ github.event.inputs.version_type }}"
            echo "- **Branch**: \`${{ steps.bump.outputs.branch }}\`"
            echo "- **Pull Request**: ${{ steps.pr.outputs.url }}"
            echo ""
            echo "Merge the PR to tag \`v${{ steps.bump.outputs.new_version }}\` and publish."
          } >> $GITHUB_STEP_SUMMARY

          if [ "$HAS_PAT" != "true" ]; then
            {
              echo ""
              echo "> [!WARNING]"
              echo "> No \`RELEASE_PAT\` secret is set, so this PR was created with \`GITHUB_TOKEN\`."
              echo "> GitHub does not start workflows for such a PR, so the required checks will not"
              echo "> run and the PR cannot be merged as-is. Close and reopen the PR to kick them off,"
              echo "> or add a \`RELEASE_PAT\` secret to fix this properly."
            } >> $GITHUB_STEP_SUMMARY
          fi
